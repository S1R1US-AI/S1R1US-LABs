name: Rebuild .output

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build DigitalOcean bundle
        run: npm run build:do
      - name: Push branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="rebuild-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add .output
          if git diff --cached --quiet; then
            echo "No .output changes"
            exit 0
          fi
          git commit -m "rebuild .output from source (PR3D1CT10N$ / checkpoint 68)"
          git push origin "$BRANCH"
          echo "OPEN_PR=https://github.com/S1R1US-AI/S1R1US-LABs/pull/new/${BRANCH}"
          echo "Open this URL and merge into main:"
          echo "https://github.com/S1R1US-AI/S1R1US-LABs/pull/new/${BRANCH}"
          gh pr create --base main --head "$BRANCH" --title "rebuild .output (checkpoint 68)" --body "Compiled .output from current main. Merge so DigitalOcean deploys PR3D1CT10N$." || echo "PR create blocked — use the pull/new URL above."
