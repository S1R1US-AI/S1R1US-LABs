name: s1r1us-labs
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: S1R1US-AI/S1R1US-LABs
      branch: main
      deploy_on_push: false
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: NITRO_PRESET
        value: node-server
        scope: RUN_AND_BUILD_TIME
      - key: VITE_AUTH_ENABLED
        value: "true"
        scope: RUN_AND_BUILD_TIME
      - key: HOST
        value: "0.0.0.0"
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
