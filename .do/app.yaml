# s1r1us.ai live production — DigitalOcean App Platform
# Project: live-production (id b0289cfa-8b5c-4661-b433-b8470a1fb120)
# Staging project first-project is separate — do not point this spec at staging.
# GitHub repo format is owner/repo: S1R1US-AI/S1R1US-LABs
# Never s1r1us.ai/your-repo. deploy_on_push: true = every push to main rebuilds live.
# Dockerfile copies prebuilt .output (no compile on the 1 GB box).
# Encrypted env (BETTER_AUTH_SECRET, GROK_AUTH_CLIENT_SECRET) lives on the dashboard.
# When you Edit App Spec, change only the github block — do not drop SECRET rows.
name: s1r1us-labs
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: s1r1us.ai
    type: PRIMARY
  - domain: www.s1r1us.ai
    type: ALIAS
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: S1R1US-AI/S1R1US-LABs
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    health_check:
      http_path: /
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: NITRO_PRESET
        value: node-server
        scope: RUN_AND_BUILD_TIME
      - key: VITE_AUTH_ENABLED
        value: "true"
        scope: RUN_AND_BUILD_TIME
      - key: HOST
        value: "0.0.0.0"
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: BETTER_AUTH_URL
        value: "https://s1r1us.ai"
        scope: RUN_TIME
      - key: GROK_AUTH_ISSUER
        value: "https://auth.grok.me"
        scope: RUN_TIME
      - key: GROK_AUTH_CLIENT_ID
        value: grok_a3389f926a0c42b3b1c95fec1287e3ef
        scope: RUN_TIME
